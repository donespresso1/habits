<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Habit tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4;--surface:#FFFFFF;--surface-2:#E3E8ED;--ink:#1C2430;--muted:#66707C;--line:#D3DAE1;
  --done:#0F6E6A;--done-ink:#FFFFFF;--done-soft:#D6ECEA;
  --miss:#B5432F;--miss-soft:#F6E1DC;
  --focus:#2F6FB0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161D;--surface:#18212B;--surface-2:#202B37;--ink:#E6EAEE;--muted:#8E99A5;--line:#2C3845;
    --done:#3FB3A8;--done-ink:#0B1A19;--done-soft:#183A39;
    --miss:#E07A63;--miss-soft:#3E2420;
    --focus:#7FB2E8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161D;--surface:#18212B;--surface-2:#202B37;--ink:#E6EAEE;--muted:#8E99A5;--line:#2C3845;
  --done:#3FB3A8;--done-ink:#0B1A19;--done-soft:#183A39;
  --miss:#E07A63;--miss-soft:#3E2420;
  --focus:#7FB2E8;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.quotes{padding:8px 4px 20px}
.big-quote{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;font-size:clamp(28px,7.5vw,38px);line-height:1.12;letter-spacing:-0.01em;margin:0 0 18px}
.rule{border-left:3px solid var(--done);padding:2px 0 2px 14px}
.rule h2{font-size:17px;font-weight:700;margin:0 0 4px}
.rule p{margin:0;color:var(--muted);font-size:15px;line-height:1.55}

.weekbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 16px}
.nav{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.nav:disabled{opacity:.35;cursor:default}
.weektitle{text-align:center}
.weektitle strong{display:block;font-size:18px;font-weight:700}
.weektitle span{font-size:14px;color:var(--muted)}
.today-btn{border:0;background:none;color:var(--done);font-weight:500;font-size:14px;cursor:pointer;padding:2px 6px}

.card{background:var(--surface);border-radius:16px;padding:16px 16px 12px;margin-bottom:14px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.card-head h3{font-size:20px;font-weight:700;margin:0;line-height:1.2}
.stats{display:flex;gap:18px;text-align:right}
.stat small{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--done)}.down{color:var(--miss)}

.warn{background:var(--miss-soft);color:var(--miss);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:500;margin-bottom:10px}
.since{background:var(--done-soft);border-radius:12px;padding:14px;margin-bottom:10px;text-align:center}
.since p{margin:0;font-size:14px}
.since .n{font-size:44px;font-weight:700;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}
.since .n small{font-size:18px;font-weight:500}

table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:12px;font-weight:500;color:var(--muted);padding:2px 0 6px;text-align:center}
th.today-col{color:var(--ink);font-weight:700}
th:first-child,td:first-child{text-align:left;width:36%}
td{padding:5px 0;border-top:1px solid var(--line);text-align:center}
td:first-child{font-size:14px;padding-right:6px;line-height:1.3}
tr.sep td{border-top:1px dashed var(--muted)}
.cell{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .12s ease}
.cell:active{transform:scale(.9)}
.cell svg{width:16px;height:16px}
.cell.done{background:var(--done);border-color:var(--done);color:var(--done-ink)}
.cell.miss{background:var(--miss-soft);border-color:var(--miss);color:var(--miss)}
.cell.future{border-style:dashed;cursor:default;opacity:.6}
.cell.is-today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--done)}
@media (max-width:380px){.cell{width:26px;height:26px}th:first-child,td:first-child{width:34%}}

.chart{position:relative;height:72px;margin-top:10px}
.legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--muted);margin:4px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--line)}
.dot.d{background:var(--done);border-color:var(--done)}
.dot.m{background:var(--miss-soft);border-color:var(--miss)}
.account{background:var(--surface);border-radius:16px;padding:16px;margin-top:14px}
.acct-title{font-weight:700;margin:0 0 10px}
.acct-note{font-size:14px;color:var(--muted);margin:0 0 10px}
.acct-note b{color:var(--ink)}
.acct-row{display:flex;gap:10px;flex-wrap:wrap}
.fld{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
.fld input{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bk.primary{background:var(--done);border-color:var(--done);color:var(--done-ink);font-weight:500}
.backup{display:flex;gap:10px;justify-content:center;margin-top:10px}
.bk{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer}
.status{text-align:center;font-size:12px;color:var(--muted);margin-top:18px}
tr.note-row td{padding:4px 0 2px}
tr.note-row td:first-child{font-size:12px;color:var(--muted)}
.nbtn{width:30px;height:26px;border:0;background:none;color:var(--muted);opacity:.5;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:6px}
.nbtn svg{width:16px;height:16px}
.nbtn.has{opacity:1;color:var(--done)}
.nbtn.has svg path{fill:var(--done-soft)}
.nbtn.open{opacity:1;background:var(--surface-2);color:var(--ink)}
.nbtn:disabled{opacity:.15;cursor:default}
.notes{list-style:none;margin:8px 0 0;padding:0;font-size:14px;color:var(--muted)}
.notes li{padding:3px 0}
.notes b{color:var(--ink);font-weight:500}
.note-edit{background:var(--surface-2);border-radius:12px;padding:12px;margin-top:10px}
.note-edit label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.note-edit textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.note-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.note-actions button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
.note-actions .nsave{background:var(--done);border-color:var(--done);color:var(--done-ink);font-weight:500}
.note-actions .ndel{margin-left:auto;color:var(--miss)}
@media (prefers-reduced-motion:reduce){.cell{transition:none}}
</style>
</head>
<body>
<main>
  <section class="quotes" aria-label="Reminders">
    <p class="big-quote">“Every man is the architect of his own fortune.”</p>
    <div class="rule">
      <h2>Rule 1: never miss two days in a row</h2>
      <p>One bad day is okay, you’re human. Two in a row is a dangerous pattern. Come back immediately the day after a miss.</p>
    </div>
  </section>

  <div class="weekbar">
    <button class="nav" id="prev" aria-label="Previous week"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="weektitle"><strong id="wk"></strong><span id="rng"></span><div><button class="today-btn" id="toToday" hidden>Back to this week</button></div></div>
    <button class="nav" id="next" aria-label="Next week"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>

  <div id="cards"></div>

  <div class="legend" aria-hidden="true"><span><i class="dot d"></i>Done</span><span><i class="dot m"></i>Missed</span><span><i class="dot"></i>Not marked</span></div>
  <p class="status" id="status">Loading…</p>
  <section class="account" id="account" aria-label="Sync account"></section>
  <div class="backup">
    <button class="bk" id="exportBtn">Export backup</button>
    <button class="bk" id="importBtn">Import backup</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
const HABITS=[
  {key:"prayer",name:"Prayer",rows:[["fajr","Fajr"],["dhuhr","Dhuhr"],["asr","Asr"],["maghrib","Maghrib"],["isha","Isha"],["witr","Witr"]],sepAt:5,scoreRows:5},
  {key:"sleep",name:"Sleep",rows:[["asleep","Asleep 22:30–23:00"],["screen","Max 15 min YouTube etc."],["phone","Phone off in bed"]]},
  {key:"coldshower",name:"Cold shower",rows:[["morning","30 seconds in the morning"]]},
  {key:"nutrition",name:"Nutrition",rows:[["mealplan","Follow meal plan"],["water","Only water, no energy drinks"],["bed","No snacks in bed"],["vitamins","Vitamins with breakfast"]]},
  {key:"dontwatch",name:"Don’t watch....",rows:[["clean","Clean day"]],since:true}
];
const DAYS=["M","T","W","T","F","S","S"];
const DAYS_FULL=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const CACHE="habit-tracker-v1";
const ICON_OK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_NO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>';

const ICON_NOTE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-4 3v-3H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>';
/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const startOfDay=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const mondayOf=d=>{const x=startOfDay(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const short=d=>d.getDate()+"."+(d.getMonth()+1);
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return {y,w}}
const weekId=mon=>{const {y,w}=isoWeek(mon);return y+"-W"+pad(w)};
const dayDiff=(a,b)=>Math.round((startOfDay(a)-startOfDay(b))/864e5);
let today=startOfDay(new Date());

/* ---------- state ---------- */
let weeks={}; // id -> {monday:"YYYY-MM-DD", cells:{}}
try{const c=JSON.parse(localStorage.getItem(CACHE)||"{}");if(c&&typeof c==="object")weeks=c}catch(e){}
let offset=0;
let openNote=null;
const cellKey=(h,r,d)=>h+"_"+r+"_"+d;
function weekFor(off){const mon=addDays(mondayOf(today),off*7);return {mon,id:weekId(mon)}}
function getVal(id,k){const w=weeks[id];return w&&w.cells&&w.cells[k]||0}
function saveCache(){try{localStorage.setItem(CACHE,JSON.stringify(weeks))}catch(e){}}

/* ---------- saving + sync (Supabase) ---------- */
const statusEl=document.getElementById("status");
function setStatus(t){statusEl.textContent=t}
const PENDING="habit-tracker-pending";
let pending=new Set();
try{pending=new Set(JSON.parse(localStorage.getItem(PENDING)||"[]"))}catch(e){}
function savePending(){try{localStorage.setItem(PENDING,JSON.stringify([...pending]))}catch(e){}}
const cfg=window.HABITS_CONFIG||{};
const configured=!!(cfg.url&&cfg.key&&!/PASTE/.test(cfg.url+cfg.key)&&window.supabase&&window.supabase.createClient);
const sb=configured?window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}}):null;
let user=null,pushing=false,pushTimer=null;
const edits={};
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}

function scheduleWrite(id){
  saveCache();pending.add(id);savePending();edits[id]=(edits[id]||0)+1;
  if(!user){setStatus(sb?"Saved on this device. Log in below to sync.":"Saved on this device");return}
  setStatus("Saving…");clearTimeout(pushTimer);pushTimer=setTimeout(push,600);
}
async function push(){
  if(!user||pushing||!pending.size)return;
  pushing=true;
  const ids=[...pending].filter(id=>weeks[id]),snap={};
  ids.forEach(id=>snap[id]=edits[id]||0);
  const rows=ids.map(id=>({user_id:user.id,week_id:id,monday:weeks[id].monday,cells:weeks[id].cells||{},notes:weeks[id].notes||{},updated_at:new Date().toISOString()}));
  let error=null;
  try{if(rows.length){const r=await sb.from("weeks").upsert(rows,{onConflict:"user_id,week_id"});error=r.error}}catch(e){error=e}
  pushing=false;
  if(error){setStatus(navigator.onLine?"Couldn’t sync: "+(error.message||"unknown error"):"Offline. Your changes will sync when you’re back online.");return}
  [...pending].forEach(id=>{if(!weeks[id]||(edits[id]||0)===snap[id])pending.delete(id)});
  savePending();
  if(pending.size)push();else setStatus("Synced");
}
async function pull(){
  if(!user)return;
  let res;
  try{res=await sb.from("weeks").select("week_id,monday,cells,notes")}catch(e){res={error:e}}
  if(res.error){setStatus(navigator.onLine?"Couldn’t sync: "+(res.error.message||"unknown error"):"Offline. Showing what’s saved on this device.");return}
  (res.data||[]).forEach(r=>{if(!pending.has(r.week_id))weeks[r.week_id]={monday:String(r.monday),cells:Object.assign({},r.cells||{}),notes:Object.assign({},r.notes||{})}});
  saveCache();render();
  if(pending.size)push();else setStatus("Synced");
}

/* account panel */
const acct=document.getElementById("account");
function renderAccount(msg){
  if(!sb){acct.innerHTML='<p class="acct-note">Sync isn’t set up yet. Add your Supabase details to <b>config.js</b> to sync between your phone and PC.</p>';return}
  if(user){
    acct.innerHTML='<p class="acct-note">Syncing as <b>'+esc(user.email||"")+'</b></p><div class="acct-row"><button class="bk" id="syncNow">Sync now</button><button class="bk" id="logout">Log out</button></div>';
    document.getElementById("syncNow").onclick=()=>{setStatus("Syncing…");pull()};
    document.getElementById("logout").onclick=async()=>{if(!confirm("Log out? Your data stays in your account and on this device."))return;await sb.auth.signOut()};
    return;
  }
  acct.innerHTML='<p class="acct-title">Log in to sync your phone and PC</p>'+
    '<label class="fld">Email<input id="em" type="email" autocomplete="email" inputmode="email"></label>'+
    '<label class="fld">Password<input id="pw" type="password" autocomplete="current-password" minlength="6"></label>'+
    '<div class="acct-row"><button class="bk primary" id="login">Log in</button><button class="bk" id="signup">Create account</button></div>'+
    (msg?'<p class="acct-note" role="status">'+esc(msg)+'</p>':'');
  const em=document.getElementById("em"),pw=document.getElementById("pw");
  document.getElementById("login").onclick=async()=>{
    if(!em.value||!pw.value){renderAccount("Type your email and password.");return}
    setStatus("Logging in…");
    const {error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});
    if(error){renderAccount(error.message);setStatus("Saved on this device. Log in below to sync.")}
  };
  document.getElementById("signup").onclick=async()=>{
    if(!em.value||pw.value.length<6){renderAccount("Type your email and a password with at least 6 characters.");return}
    const {data,error}=await sb.auth.signUp({email:em.value.trim(),password:pw.value});
    if(error){renderAccount(error.message);return}
    if(!data.session)renderAccount("Account created. Open the email from Supabase, confirm it, then come back and log in.");
  };
}
if(sb){
  sb.auth.onAuthStateChange((ev,session)=>{
    const was=user&&user.id;user=session?session.user:null;
    renderAccount();
    if(user&&user.id!==was){setStatus("Syncing…");pull()}
    if(!user)setStatus("Saved on this device. Log in below to sync.");
  });
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&user)pull()});
  window.addEventListener("online",()=>{if(user)push()});
  setInterval(()=>{if(!document.hidden&&user)pull()},60000);
}else{
  setStatus(Object.keys(weeks).length?"Saved on this device":"Nothing saved yet. Tap a box to start.");
}
renderAccount();

/* ---------- backup ---------- */
document.getElementById("exportBtn").onclick=()=>{
  const data=JSON.stringify({app:"habit-tracker",version:1,exported:new Date().toISOString(),weeks},null,1);
  const blob=new Blob([data],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="habit-tracker-backup-"+ymd(new Date())+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  setStatus("Backup downloaded");
};
const fileIn=document.getElementById("importFile");
document.getElementById("importBtn").onclick=()=>fileIn.click();
fileIn.onchange=async()=>{
  const f=fileIn.files&&fileIn.files[0];if(!f)return;
  try{
    const obj=JSON.parse(await f.text());
    if(!obj||obj.app!=="habit-tracker"||typeof obj.weeks!=="object")throw new Error("bad");
    if(!confirm("Replace your data with the backup from "+String(obj.exported||"").slice(0,10)+"?"))return;
    weeks={};Object.keys(obj.weeks).forEach(id=>{const w=obj.weeks[id];if(w&&w.monday)weeks[id]={monday:String(w.monday),cells:Object.assign({},w.cells||{}),notes:Object.assign({},w.notes||{})}});
    Object.keys(weeks).forEach(id=>pending.add(id));savePending();
    closeNote();saveCache();render();setStatus("Backup imported");push();
  }catch(e){setStatus("That file isn’t a habit tracker backup. Choose a file named habit-tracker-backup-….json")}
  fileIn.value="";
};

/* ---------- logic ---------- */
function weekScore(h,id){
  const rows=h.scoreRows?h.rows.slice(0,h.scoreRows):h.rows;let ok=0,mk=0;
  rows.forEach(([rk])=>{for(let d=0;d<7;d++){const v=getVal(id,cellKey(h.key,rk,d));if(v)mk++;if(v===1)ok++}});
  return mk?Math.round(ok/mk*100):null;
}
function history(h,rk){ // [{date,v}] sorted, marked only, up to today
  const out=[];
  Object.keys(weeks).forEach(id=>{const w=weeks[id];if(!w||!w.monday)return;const mon=parseYmd(w.monday);
    for(let d=0;d<7;d++){const v=(w.cells||{})[cellKey(h.key,rk,d)];if(v){const dt=addDays(mon,d);if(dt<=today)out.push({dt,v})}}});
  out.sort((a,b)=>a.dt-b.dt);return out;
}
function twoMisses(h){
  return h.rows.filter(([rk])=>{const s=history(h,rk);const n=s.length;return n>1&&s[n-1].v===2&&s[n-2].v===2&&dayDiff(s[n-1].dt,s[n-2].dt)===1}).map(r=>r[1]);
}
function sinceHtml(h){
  const s=history(h,h.rows[0][0]);
  if(!s.length)return '<p>Mark your first clean day below to start the count.</p>';
  const misses=s.filter(x=>x.v===2);
  if(!misses.length){const first=s[0].dt;const n=dayDiff(today,first)+1;
    return '<p>You haven’t “Watched and ....” since you started on '+short(first)+'</p><p class="n">'+n+' <small>'+(n===1?'day':'days')+'</small></p>'}
  const last=misses[misses.length-1].dt;const n=dayDiff(today,last);
  return '<p>You haven’t “Watched and ....” since '+short(last)+'</p><p class="n">'+n+' <small>'+(n===1?'day':'days')+'</small></p>';
}

/* ---------- render ---------- */
const cardsEl=document.getElementById("cards");
const charts={};
HABITS.forEach(h=>{
  const stats='<div class="stat"><small>This week</small><b id="s-'+h.key+'">–</b></div>'+(h.since?'':'<div class="stat"><small>vs last week</small><b id="d-'+h.key+'">–</b></div>');
  cardsEl.insertAdjacentHTML("beforeend",
    '<section class="card" aria-labelledby="h-'+h.key+'"><div class="card-head"><h3 id="h-'+h.key+'">'+h.name+'</h3><div class="stats">'+stats+'</div></div>'+
    (h.since?'<div class="since" id="x-'+h.key+'"></div>':'')+
    '<div id="w-'+h.key+'"></div><table><thead><tr id="th-'+h.key+'"></tr></thead><tbody id="t-'+h.key+'"></tbody></table>'+
    '<div id="nl-'+h.key+'"></div><div id="n-'+h.key+'"></div>'+
    '<div class="chart"><canvas id="c-'+h.key+'" aria-label="'+h.name+' week score for the last 8 weeks" role="img"></canvas></div></section>');
});

function render(){
  today=startOfDay(new Date());
  const {mon,id}=weekFor(offset);
  const isCur=offset===0;
  const {w}=isoWeek(mon);
  document.getElementById("wk").textContent="Week "+w+(isCur?", this week":"");
  document.getElementById("rng").textContent=short(mon)+" – "+short(addDays(mon,6))+"."+addDays(mon,6).getFullYear();
  document.getElementById("next").disabled=isCur;
  document.getElementById("prev").disabled=offset<=-104;
  document.getElementById("toToday").hidden=isCur;
  const prevId=weekFor(offset-1).id;

  HABITS.forEach(h=>{
    let th='<th scope="col"><span class="sr-only"></span></th>';
    for(let d=0;d<7;d++){const dt=addDays(mon,d);th+='<th scope="col"'+(dayDiff(dt,today)===0?' class="today-col"':'')+'>'+DAYS[d]+'<br>'+dt.getDate()+'</th>'}
    document.getElementById("th-"+h.key).innerHTML=th;
    let body="";
    h.rows.forEach(([rk,label],ri)=>{
      body+='<tr'+(h.sepAt===ri?' class="sep"':'')+'><td>'+label+'</td>';
      for(let d=0;d<7;d++){
        const dt=addDays(mon,d),fut=dt>today,isT=dayDiff(dt,today)===0;
        const v=getVal(id,cellKey(h.key,rk,d));
        const cls="cell"+(fut?" future":v===1?" done":v===2?" miss":"")+(isT?" is-today":"");
        const state=v===1?"done":v===2?"missed":"not marked";
        body+='<td><button class="'+cls+'" data-h="'+h.key+'" data-r="'+rk+'" data-d="'+d+'"'+(fut?' disabled':'')+' aria-label="'+label+', '+DAYS[d]+' '+short(dt)+': '+state+'">'+(fut?'':v===1?ICON_OK:v===2?ICON_NO:'')+'</button></td>';
      }
      body+='</tr>';
    });
    body+='<tr class="note-row"><td>Note</td>';
    for(let d=0;d<7;d++){
      const dt=addDays(mon,d),fut=dt>today,has=!!getNote(id,h.key,d);
      const open=openNote&&openNote.h===h.key&&openNote.d===d&&openNote.id===id;
      body+='<td><button class="nbtn'+(has?' has':'')+(open?' open':'')+'" data-nh="'+h.key+'" data-nd="'+d+'"'+(fut?' disabled':'')+' aria-label="Note for '+h.name+', '+DAYS_FULL[d]+' '+short(dt)+(has?', has a note':'')+'">'+ICON_NOTE+'</button></td>';
    }
    body+='</tr>';
    document.getElementById("t-"+h.key).innerHTML=body;
    let nl="";
    for(let d=0;d<7;d++){const t=getNote(id,h.key,d);if(t)nl+='<li><b>'+DAYS_FULL[d]+':</b> '+esc(t)+'</li>'}
    document.getElementById("nl-"+h.key).innerHTML=nl?'<ul class="notes">'+nl+'</ul>':'';

    const sc=weekScore(h,id);
    document.getElementById("s-"+h.key).textContent=sc===null?"–":sc+"%";
    if(!h.since){
      const el=document.getElementById("d-"+h.key),ps=weekScore(h,prevId);
      el.className="";
      if(sc===null||ps===null){el.textContent="–"}
      else{const x=sc-ps;el.textContent=(x>0?"+":"")+x+"%";el.className=x>=0?"up":"down"}
    }else{
      document.getElementById("x-"+h.key).innerHTML=sinceHtml(h);
    }
    const warn=isCur?twoMisses(h):[];
    document.getElementById("w-"+h.key).innerHTML=warn.length?'<div class="warn" role="status">2 misses in a row: '+warn.join(", ")+'. Come back today.</div>':'';

    // chart: 8 weeks ending at viewed week
    const labels=[],data=[];
    for(let i=7;i>=0;i--){const wk=weekFor(offset-i);labels.push("W"+isoWeek(wk.mon).w);data.push(weekScore(h,wk.id))}
    drawChart(h.key,labels,data);
  });
}

function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function drawChart(k,labels,data){
  if(!window.Chart)return;
  const accent=cssVar("--done"),muted=cssVar("--muted");
  if(charts[k]){const c=charts[k];c.data.labels=labels;c.data.datasets[0].data=data;c.data.datasets[0].borderColor=accent;c.data.datasets[0].pointBackgroundColor=accent;c.options.scales.x.ticks.color=muted;c.update("none");return}
  charts[k]=new Chart(document.getElementById("c-"+k),{type:"line",
    data:{labels,datasets:[{data,borderColor:accent,pointBackgroundColor:accent,pointRadius:(ctx)=>ctx.dataIndex===labels.length-1?4:2,borderWidth:2,tension:.3,spanGaps:true}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.y===null?"No marks":c.parsed.y+"%"}}},
      scales:{y:{min:0,max:100,display:false},x:{grid:{display:false},border:{display:false},ticks:{color:muted,font:{size:11,family:"Schibsted Grotesk"},maxRotation:0}}}}});
}

function getNote(id,hk,d){const w=weeks[id];return w&&w.notes&&w.notes[hk+"_"+d]||""}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function closeNote(){if(openNote){const el=document.getElementById("n-"+openNote.h);if(el)el.innerHTML=""}openNote=null}
function openNoteEditor(hk,d){
  closeNote();
  const {id,mon}=weekFor(offset);openNote={h:hk,d,id};
  const h=HABITS.find(x=>x.key===hk),dt=addDays(mon,d),cur=getNote(id,hk,d);
  document.getElementById("n-"+hk).innerHTML='<div class="note-edit"><label for="ta-'+hk+'">Note for '+h.name+', '+DAYS_FULL[d]+' '+short(dt)+'</label><textarea id="ta-'+hk+'" rows="2" maxlength="500" placeholder="For example: I didn’t do it because…"></textarea><div class="note-actions"><button class="nsave">Save note</button><button class="ncancel">Cancel</button>'+(cur?'<button class="ndel">Delete note</button>':'')+'</div></div>';
  const ta=document.getElementById("ta-"+hk);ta.value=cur;ta.focus();
}
function saveNote(text){
  if(!openNote)return;
  const {h,d,id}=openNote,mon=weekFor(offset).mon;
  if(!weeks[id])weeks[id]={monday:ymd(mon),cells:{}};
  if(!weeks[id].notes)weeks[id].notes={};
  const t=text.trim();
  if(t)weeks[id].notes[h+"_"+d]=t;else delete weeks[id].notes[h+"_"+d];
  closeNote();render();scheduleWrite(id);
}
cardsEl.addEventListener("click",e=>{
  const nb=e.target.closest(".nbtn");
  if(nb){
    if(nb.disabled)return;
    const hk=nb.dataset.nh,d=+nb.dataset.nd,{id}=weekFor(offset);
    if(openNote&&openNote.h===hk&&openNote.d===d&&openNote.id===id){closeNote()}else{openNoteEditor(hk,d)}
    render();return;
  }
  if(e.target.closest(".nsave")){saveNote(document.getElementById("ta-"+openNote.h).value);return}
  if(e.target.closest(".ndel")){saveNote("");return}
  if(e.target.closest(".ncancel")){closeNote();render();return}
  const b=e.target.closest(".cell");if(!b||b.disabled)return;
  const {id,mon}=weekFor(offset);
  if(!weeks[id])weeks[id]={monday:ymd(mon),cells:{}};
  const k=cellKey(b.dataset.h,b.dataset.r,b.dataset.d);
  const v=((weeks[id].cells[k]||0)+1)%3;
  if(v)weeks[id].cells[k]=v;else delete weeks[id].cells[k];
  render();scheduleWrite(id);
});
document.getElementById("prev").onclick=()=>{closeNote();offset--;render()};
document.getElementById("next").onclick=()=>{if(offset<0){closeNote();offset++;render()}};
document.getElementById("toToday").onclick=()=>{closeNote();offset=0;render()};
if(window.matchMedia){const mq=matchMedia("(prefers-color-scheme: dark)");mq.addEventListener&&mq.addEventListener("change",()=>{Object.keys(charts).forEach(k=>{charts[k].destroy();delete charts[k]});render()})}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
render();
if(!window.Chart){window.addEventListener("load",render)}
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>
<style>.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style>
</body>
</html>
